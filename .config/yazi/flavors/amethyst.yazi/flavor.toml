# vim:fileencoding=utf-8:foldmethod=marker

# : Manager {{{

[mgr]
cwd = { fg = "#7fb3c4" }

# Find
find_keyword  = { fg = "#d9b77a", bold = true, italic = true, underline = true }
find_position = { fg = "#d6a6f0", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#9fbf8a", bg = "#9fbf8a" }
marker_cut      = { fg = "#e0607a", bg = "#e0607a" }
marker_marked   = { fg = "#7fb3c4", bg = "#7fb3c4" }
marker_selected = { fg = "#d9b77a", bg = "#d9b77a" }

# Count
count_copied   = { fg = "#000000", bg = "#9fbf8a" }
count_cut      = { fg = "#000000", bg = "#e0607a" }
count_selected = { fg = "#000000", bg = "#d9b77a" }

# Border
border_symbol = "│"
border_style  = { fg = "#6e6382" }

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "#000000", bg = "#9a8cff", bold = true }
inactive = { fg = "#9a8cff", bg = "#1a1424" }

# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "#000000", bg = "#9a8cff", bold = true }
normal_alt  = { fg = "#9a8cff", bg = "#1a1424" }

# Select mode
select_main = { fg = "#000000", bg = "#7fb3c4", bold = true }
select_alt  = { fg = "#7fb3c4", bg = "#1a1424" }

# Unset mode
unset_main = { fg = "#000000", bg = "#e4d8f0", bold = true }
unset_alt  = { fg = "#e4d8f0", bg = "#1a1424" }

# : }}}


# : Status bar {{{

[status]
# Permissions
perm_sep   = { fg = "#6e6382" }
perm_type  = { fg = "#9a8cff" }
perm_read  = { fg = "#d9b77a" }
perm_write = { fg = "#e0607a" }
perm_exec  = { fg = "#9fbf8a" }

# Progress
progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#9fbf8a", bg = "#2b2238" }
progress_error  = { fg = "#d9b77a", bg = "#e0607a" }

# : }}}


# : Pick {{{

[pick]
border   = { fg = "#9a8cff" }
active   = { fg = "#d6a6f0", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border   = { fg = "#9a8cff" }
title    = {}
value    = {}
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#9a8cff" }

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "#9a8cff" }
title   = {}
hovered = { fg = "#d6a6f0", bold = true }

# : }}}


# : Which {{{

[which]
border          = { fg = "#9a8cff" }
cand            = { fg = "#7fb3c4" }
rest            = { fg = "#7f7494" }
desc            = { fg = "#d6a6f0" }
separator       = "  "
separator_style = { fg = "#3d3150" }

# : }}}


# : Help {{{

[help]
on      = { fg = "#7fb3c4" }
run     = { fg = "#d6a6f0" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#1a1424", bg = "#c9c0db" }

# : }}}


# : Spotter {{{

[spot]
border   = { fg = "#9a8cff" }
title    = { fg = "#9a8cff" }
tbl_col  = { fg = "#7fb3c4" }
tbl_cell = { fg = "#d6a6f0", bg = "#2b2238" }

# : }}}


# : Notification {{{

[notify]
title_info  = { fg = "#9fbf8a" }
title_warn  = { fg = "#d9b77a" }
title_error = { fg = "#e0607a" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
	# Image
	{ mime = "**/image/*", fg = "#7fb3c4" },
	# Media
	{ mime = "**/{audio,video}/*", fg = "#d9b77a" },
	# Archive
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d6a6f0" },
	# Document
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#9fbf8a" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#7f7494" },
	# Fallback
	{ url = "*", fg = "#c9c0db" },
	{ url = "*/", fg = "#9a8cff" },
]

# : }}}

[icon]

dirs = [
	{ name = ".config", text = "", fg = "#d6a6f0" },
	{ name = ".git", text = "", fg = "#7fb3c4" },
	{ name = ".github", text = "", fg = "#9a8cff" },
	{ name = ".npm", text = "", fg = "#9a8cff" },
	{ name = "Desktop", text = "", fg = "#7fb3c4" },
	{ name = "Development", text = "", fg = "#7fb3c4" },
	{ name = "Documents", text = "", fg = "#7fb3c4" },
	{ name = "Downloads", text = "", fg = "#7fb3c4" },
	{ name = "Library", text = "", fg = "#7fb3c4" },
	{ name = "Movies", text = "", fg = "#7fb3c4" },
	{ name = "Music", text = "", fg = "#7fb3c4" },
	{ name = "Pictures", text = "", fg = "#7fb3c4" },
	{ name = "Public", text = "", fg = "#7fb3c4" },
	{ name = "Videos", text = "", fg = "#7fb3c4" },
]
conds = [
	# Special files
	{ if = "orphan", text = "", fg = "#c9c0db" },
	{ if = "link", text = "", fg = "#6e6382" },
	{ if = "block", text = "", fg = "#e4d8f0" },
	{ if = "char", text = "", fg = "#e4d8f0" },
	{ if = "fifo", text = "", fg = "#e4d8f0" },
	{ if = "sock", text = "", fg = "#e4d8f0" },
	{ if = "sticky", text = "", fg = "#e4d8f0" },
	{ if = "dummy", text = "", fg = "#e0607a" },

	# Fallback
	{ if = "dir & hovered", text = "", fg = "#9a8cff" },
	{ if = "dir", text = "", fg = "#9a8cff" },
	{ if = "exec", text = "", fg = "#9fbf8a" },
	{ if = "!dir", text = "", fg = "#c9c0db" },
]
