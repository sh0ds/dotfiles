# ~/.config/lazygit/config.yml: Diag, square borders, blue on the
# focused panel. Run `lg`, or Ctrl+G inside Helix.
gui:
  nerdFontsVersion: "3"
  border: single
  theme:
    activeBorderColor:
      - '#c6db91'
      - bold
    inactiveBorderColor:
      - '#485344'
    searchingActiveBorderColor:
      - '#e9b078'
    optionsTextColor:
      - '#c6db91'
    selectedLineBgColor:
      - '#38452c'
    inactiveViewSelectedLineBgColor:
      - '#1c201c'
    cherryPickedCommitFgColor:
      - '#c6db91'
    cherryPickedCommitBgColor:
      - '#333c32'
    markedBaseCommitFgColor:
      - '#141613'
    markedBaseCommitBgColor:
      - '#e9b078'
    unstagedChangesColor:
      - '#e78a7e'
    defaultFgColor:
      - '#ecf0e5'
    authorColors:
      '*': '#deecb9'
