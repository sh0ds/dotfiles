# ~/.config/lazygit/config.yml: Diag, square borders, blue on the
# focused panel. Run `lg`, or SPACE g g inside Neovim.
gui:
  nerdFontsVersion: "3"
  border: single
  theme:
    activeBorderColor:
      - '#1793d1'
      - bold
    inactiveBorderColor:
      - '#3f4650'
    searchingActiveBorderColor:
      - '#ffb000'
    optionsTextColor:
      - '#1793d1'
    selectedLineBgColor:
      - '#0e3d5c'
    inactiveViewSelectedLineBgColor:
      - '#0d1014'
    cherryPickedCommitFgColor:
      - '#1793d1'
    cherryPickedCommitBgColor:
      - '#2e353d'
    markedBaseCommitFgColor:
      - '#1793d1'
    markedBaseCommitBgColor:
      - '#ffb000'
    unstagedChangesColor:
      - '#e5484d'
    defaultFgColor:
      - '#e6e8ea'
    authorColors:
      '*': '#5fb8e8'
