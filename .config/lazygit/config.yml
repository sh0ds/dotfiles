# ~/.config/lazygit/config.yml: Afterhours, rounded borders, blue on the
# focused panel. Run `lg`, or Ctrl+G inside Helix.
gui:
  nerdFontsVersion: "3"
  border: rounded
  theme:
    activeBorderColor:
      - '#b4c97f'
      - bold
    inactiveBorderColor:
      - '#343c31'
    searchingActiveBorderColor:
      - '#d99f66'
    optionsTextColor:
      - '#b4c97f'
    selectedLineBgColor:
      - '#26301e'
    inactiveViewSelectedLineBgColor:
      - '#121411'
    cherryPickedCommitFgColor:
      - '#b4c97f'
    cherryPickedCommitBgColor:
      - '#242a23'
    markedBaseCommitFgColor:
      - '#0c0d0b'
    markedBaseCommitBgColor:
      - '#d99f66'
    unstagedChangesColor:
      - '#d9786c'
    defaultFgColor:
      - '#dfe3d8'
    authorColors:
      '*': '#cadba3'
