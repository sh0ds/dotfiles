# ~/.config/lazygit/config.yml: Amethyst, square borders, violet on the
# focused panel. Run `lg`, or SPACE g g inside Neovim.
gui:
  nerdFontsVersion: "3"
  border: single
  theme:
    activeBorderColor:
      - '#b06cff'
      - bold
    inactiveBorderColor:
      - '#9a90ae'
    searchingActiveBorderColor:
      - '#d9b77a'
    optionsTextColor:
      - '#9a8cff'
    selectedLineBgColor:
      - '#1a1424'
    inactiveViewSelectedLineBgColor:
      - '#5e5270'
    cherryPickedCommitFgColor:
      - '#b06cff'
    cherryPickedCommitBgColor:
      - '#2b2238'
    markedBaseCommitFgColor:
      - '#9a8cff'
    markedBaseCommitBgColor:
      - '#d9b77a'
    unstagedChangesColor:
      - '#e0607a'
    defaultFgColor:
      - '#c9c0db'
    authorColors:
      '*': '#c99bff'
