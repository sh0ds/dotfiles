# ~/.config/lazygit/config.yml: Diag, square borders, blue on the
# focused panel. Run `lg`, or SPACE g g inside Neovim.
gui:
  nerdFontsVersion: "3"
  border: single
  theme:
    activeBorderColor:
      - '#1793d1'
      - bold
    inactiveBorderColor:
      - '#a3aab2'
    searchingActiveBorderColor:
      - '#ffb000'
    optionsTextColor:
      - '#4aa3df'
    selectedLineBgColor:
      - '#161a1f'
    inactiveViewSelectedLineBgColor:
      - '#5d6670'
    cherryPickedCommitFgColor:
      - '#1793d1'
    cherryPickedCommitBgColor:
      - '#2e353d'
    markedBaseCommitFgColor:
      - '#4aa3df'
    markedBaseCommitBgColor:
      - '#ffb000'
    unstagedChangesColor:
      - '#e5484d'
    defaultFgColor:
      - '#e6e8ea'
    authorColors:
      '*': '#5fb8e8'
