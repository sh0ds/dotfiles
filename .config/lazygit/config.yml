# ~/.config/lazygit/config.yml: Afterhours, square borders, blue on the
# focused panel. Run `lg`.
gui:
  nerdFontsVersion: "3"
  border: single
  theme:
    activeBorderColor:
      - '#b49cf0'
      - bold
    inactiveBorderColor:
      - '#35323f'
    searchingActiveBorderColor:
      - '#d99f66'
    optionsTextColor:
      - '#b49cf0'
    selectedLineBgColor:
      - '#2b2540'
    inactiveViewSelectedLineBgColor:
      - '#131218'
    cherryPickedCommitFgColor:
      - '#b49cf0'
    cherryPickedCommitBgColor:
      - '#25232d'
    markedBaseCommitFgColor:
      - '#0d0c10'
    markedBaseCommitBgColor:
      - '#d99f66'
    unstagedChangesColor:
      - '#d9786c'
    defaultFgColor:
      - '#e0dde8'
    authorColors:
      '*': '#cdbcf7'
