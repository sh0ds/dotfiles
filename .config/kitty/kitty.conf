# Afterhours terminal: JetBrains Mono (Nerd Font build, icons included), the
# one font of the whole desktop.
# Opaque charcoal keeps game artwork and source text colour-accurate.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
# A little more air between lines than the default reads calmer.
modify_font      cell_height 112%
disable_ligatures cursor

scrollback_lines 20000
enable_audio_bell no
confirm_os_window_close 0
window_padding_width 14 18
background_opacity 1.0
hide_window_decorations yes
# Splits (ctrl+shift+enter): thin rules, phosphor on the focused one, and
# the unfocused split's text dims a little.
draw_minimal_borders yes
window_border_width 1px
active_border_color #b4c97f
inactive_border_color #242a23
inactive_text_alpha 0.8
cursor_shape block
cursor_shape_unfocused hollow
# A slow, eased breathe instead of a hard blink; it stops after 15 s idle.
cursor_blink_interval 0.9 ease-in-out
cursor_stop_blinking_after 15
# The cursor leaves a short phosphor trail when it jumps 4+ cells (a search
# hit, gg/ge, a click), so the eye follows it. Typing stays still.
cursor_trail 3
cursor_trail_decay 0.08 0.25
cursor_trail_start_threshold 4
shell_integration enabled

# Afterhours: charcoal, phosphor focus and muted semantic colours, so
# ls, git and compiler output stay readable without turning into a rainbow.
foreground #c9d0c1
background #0c0d0b
selection_foreground #ecefe5
selection_background #26301e
cursor #b4c97f
cursor_text_color #0c0d0b
url_color #cadba3
color0  #121411
color8  #929c8a
color1  #d9786c
color9  #dca598
color2  #83b48f
color10 #a8cbae
color3  #d99f66
color11 #e3c299
color4  #5e9bb4
color12 #91b9c9
color5  #b4c97f
color13 #cadba3
color6  #75aaa4
color14 #a0c8c4
color7  #c9d0c1
color15 #ecefe5

# 180 Hz: one frame is 5.6 ms
repaint_delay 5
input_delay 1
sync_to_monitor yes

# notification when a command over 15 s finishes while you look elsewhere
notify_on_cmd_finish unfocused 15

# Tabs (ctrl+shift+t): rounded pills at the top, numbered, the active one
# in phosphor.
tab_bar_edge top
tab_bar_margin_height 6 4
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2
tab_title_template " {index} {title} "
tab_bar_background #0c0d0b
active_tab_foreground #0c0d0b
active_tab_background #b4c97f
active_tab_font_style bold
inactive_tab_foreground #929c8a
inactive_tab_background #1a1e19
inactive_tab_font_style normal
