# ~/.config/kitty/kitty.conf
# Terminess (Terminus with Nerd Font icons), the one font of the whole
# desktop: drawn for screens, readable from small to large. 13.5 pt = 18 px,
# one of its native sizes. kitty draws box and block characters itself, so
# tmux and btop lines still join up.
font_family      Terminess Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.5
disable_ligatures always
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD,U+100000-U+10FFFD Symbols Nerd Font Mono

scrollback_lines 20000
enable_audio_bell no
confirm_os_window_close 0
window_padding_width 6 8
background_opacity 1.0
cursor_shape block
cursor_blink_interval 0
shell_integration enabled

# Diag: black, cool greys, one Arch blue. The other colours are muted so
# ls, git and compiler output stay readable without turning into a rainbow.
foreground #c4c9ce
background #000000
selection_foreground #f4f6f8
selection_background #0e3d5c
cursor #1793d1
cursor_text_color #000000
url_color #5fb8e8
color0  #0d1014
color8  #5d6670
color1  #e5484d
color9  #ee7a7d
color2  #75c94d
color10 #9fdc7c
color3  #ffb000
color11 #ffd166
color4  #4aa3df
color12 #8fc3e6
color5  #1793d1
color13 #5fb8e8
color6  #7cc7d6
color14 #a9e0ea
color7  #c4c9ce
color15 #f4f6f8

# 180 Hz: one frame is 5.6 ms
repaint_delay 5
input_delay 1
sync_to_monitor yes

# notification when a command over 15 s finishes while you look elsewhere
notify_on_cmd_finish unfocused 15
