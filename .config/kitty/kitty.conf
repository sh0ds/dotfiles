# ~/.config/kitty/kitty.conf
font_family      JetBrainsMono Nerd Font
font_size        11.5
disable_ligatures cursor

scrollback_lines 20000
enable_audio_bell no
confirm_os_window_close 0
window_padding_width 6
background_opacity 0.85
cursor_shape block
shell_integration enabled

# Catppuccin Mocha
foreground #cdd6f4
background #1e1e2e
selection_foreground #1e1e2e
selection_background #f5e0dc
cursor #f5e0dc
cursor_text_color #1e1e2e
url_color #f5e0dc
color0  #45475a
color8  #585b70
color1  #f38ba8
color9  #f38ba8
color2  #a6e3a1
color10 #a6e3a1
color3  #f9e2af
color11 #f9e2af
color4  #89b4fa
color12 #89b4fa
color5  #f5c2e7
color13 #f5c2e7
color6  #94e2d5
color14 #94e2d5
color7  #bac2de
color15 #a6adc8

cursor_trail 3
cursor_trail_decay 0.1 0.4

# 180 Hz: one frame is 5.6 ms
repaint_delay 5
input_delay 1
sync_to_monitor yes

# notification when a command over 15 s finishes while you look elsewhere
notify_on_cmd_finish unfocused 15
