# Afterhours terminal: JetBrains Mono for code, Nerd Font symbols for helpers.
# Opaque charcoal keeps game artwork and source text colour-accurate.
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
disable_ligatures always
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD,U+100000-U+10FFFD Symbols Nerd Font Mono

scrollback_lines 20000
enable_audio_bell no
confirm_os_window_close 0
window_padding_width 16
background_opacity 1.0
cursor_shape block
cursor_blink_interval 0
# The cursor leaves a short blue trail when it jumps 4+ cells (a search hit,
# gg/ge, a click), so the eye follows it. Typing and h/j/k/l stay still.
cursor_trail 0
cursor_trail_decay 0.08 0.25
cursor_trail_start_threshold 4
shell_integration enabled

# Afterhours: charcoal, phosphor focus and muted semantic colours, so
# ls, git and compiler output stay readable without turning into a rainbow.
foreground #d8dfd0
background #141613
selection_foreground #f5f7ef
selection_background #38452c
cursor #c6db91
cursor_text_color #141613
url_color #deecb9
color0  #1c201c
color8  #aab5a2
color1  #e78a7e
color9  #edb7ac
color2  #95c7a1
color10 #bcddc2
color3  #e9b078
color11 #f2d3ae
color4  #6babc5
color12 #a5ccdc
color5  #c6db91
color13 #deecb9
color6  #86beb8
color14 #b4dbd7
color7  #d8dfd0
color15 #f5f7ef

# 180 Hz: one frame is 5.6 ms
repaint_delay 5
input_delay 1
sync_to_monitor yes

# notification when a command over 15 s finishes while you look elsewhere
notify_on_cmd_finish unfocused 15

# The terminal's own tabs match the editor/browser: numbered, square, quiet.
tab_bar_style separator
tab_separator " │ "
tab_title_template "{index}: {title}"
active_tab_foreground #c6db91
active_tab_background #1c201c
active_tab_font_style bold
inactive_tab_foreground #aab5a2
inactive_tab_background #141613
inactive_tab_font_style normal
