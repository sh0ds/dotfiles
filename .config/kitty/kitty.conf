# ~/.config/kitty/kitty.conf
# VT323, the font of sh0ds.dev and the bar. It has no bold, italics or icons:
# bold just stays regular, and the Nerd Font icons (nvim, yazi, starship)
# come from the symbols-only font below. kitty draws box and block
# characters itself, so tmux and btop lines still join up.
# VT323 is pixel art drawn on a 40-unit grid (1000 units per em), so it is
# only sharp at 25 px and multiples of it. kitty counts in points at 96 dpi:
# 18.75 pt = 25 px, every glyph pixel lands on a screen pixel and each cell
# is exactly 10 px wide. Any other size smears the edges and spaces letters
# unevenly. Next sharp size up is 37.5 (50 px).
font_family      VT323
bold_font        VT323
italic_font      VT323
bold_italic_font VT323
font_size        18.75
symbol_map U+E000-U+E00A,U+E0A0-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+F2FF,U+F300-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 Symbols Nerd Font Mono
disable_ligatures always
# disable_ligatures only covers programming ligatures (calt). VT323 also
# joins fi, fl and ff (liga, dlig), which squeezes two letters into one
# cell and leaves a gap after them ("dotfi les"). Off:
font_features VT323-Regular -liga -dlig

scrollback_lines 20000
enable_audio_bell no
confirm_os_window_close 0
window_padding_width 6 8
background_opacity 1.0
cursor_shape block
cursor_blink_interval 0
shell_integration enabled

# Diag: black, cool greys, one Arch blue. The other colours are muted so
# ls, git and compiler output stay readable without turning into a rainbow.
foreground #c4c9ce
background #000000
selection_foreground #f4f6f8
selection_background #0e3d5c
cursor #1793d1
cursor_text_color #000000
url_color #5fb8e8
color0  #0d1014
color8  #5d6670
color1  #e5484d
color9  #ee7a7d
color2  #75c94d
color10 #9fdc7c
color3  #ffb000
color11 #ffd166
color4  #4aa3df
color12 #8fc3e6
color5  #1793d1
color13 #5fb8e8
color6  #7cc7d6
color14 #a9e0ea
color7  #c4c9ce
color15 #f4f6f8

# 180 Hz: one frame is 5.6 ms
repaint_delay 5
input_delay 1
sync_to_monitor yes

# notification when a command over 15 s finishes while you look elsewhere
notify_on_cmd_finish unfocused 15
