# ~/.config/kitty/kitty.conf
font_family      Terminess Nerd Font Mono
font_size        13
disable_ligatures always

scrollback_lines 20000
enable_audio_bell no
confirm_os_window_close 0
window_padding_width 6 8
background_opacity 1.0
cursor_shape block
cursor_blink_interval 0
shell_integration enabled

# Amethyst: black, plum greys, one violet. The other colours are muted so
# ls, git and compiler output stay readable without turning into a rainbow.
foreground #b0a6c4
background #000000
selection_foreground #ece4fb
selection_background #3a2a55
cursor #b06cff
cursor_text_color #000000
url_color #c99bff
color0  #0b0910
color8  #5e5270
color1  #e0607a
color9  #e88a9a
color2  #9fbf8a
color10 #b4d0a2
color3  #d9b77a
color11 #e6c995
color4  #9a8cff
color12 #b3a9ff
color5  #b06cff
color13 #c99bff
color6  #7fb3c4
color14 #9cc6d4
color7  #b0a6c4
color15 #ece4fb

# 180 Hz: one frame is 5.6 ms
repaint_delay 5
input_delay 1
sync_to_monitor yes

# notification when a command over 15 s finishes while you look elsewhere
notify_on_cmd_finish unfocused 15
