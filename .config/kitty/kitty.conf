# Afterhours terminal: JetBrains Mono (Nerd Font build, icons included), the
# one font of the whole desktop.
# Opaque charcoal keeps game artwork and source text colour-accurate.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
# A little more air between lines than the default reads calmer.
modify_font      cell_height 112%
disable_ligatures cursor

scrollback_lines 20000
enable_audio_bell no
confirm_os_window_close 0
window_padding_width 18 22
background_opacity 0.82
hide_window_decorations yes
# Splits (ctrl+shift+enter): thin rules, violet on the focused one, and
# the unfocused split's text dims a little.
draw_minimal_borders yes
window_border_width 1px
active_border_color #b49cf0
inactive_border_color #25232d
inactive_text_alpha 0.8

# The cursor: a 3 px violet line (programs that want a block still ask for
# one). Instead of blinking it fades out and in
# on a smooth curve, and goes still after 8 s without typing. Moves of 2+
# cells glide: a short violet streak follows it and is gone in about a
# tenth of a second. In an unfocused window it keeps its shape and stops.
cursor_shape beam
cursor_beam_thickness 3
cursor_shape_unfocused unchanged
cursor_blink_interval 0.8 ease-in-out
cursor_stop_blinking_after 8
cursor_trail 1
cursor_trail_decay 0.02 0.12
cursor_trail_start_threshold 2
cursor_trail_color #b49cf0

# No beep: the window glows violet for a moment instead.
visual_bell_duration 0.25 ease-out
visual_bell_color #2a2340
window_alert_on_bell yes

# A thin square scrollbar that only shows while you scroll back
# (kitty 0.43+; older versions ignore these lines).
scrollbar scrolled
scrollbar_width 0.5
scrollbar_hover_width 1
scrollbar_radius 0
scrollbar_handle_color #35323f
scrollbar_handle_opacity 1
# no-cursor: the shell leaves the cursor shape alone, so it stays a line.
shell_integration no-cursor

# Afterhours: charcoal, violet focus and muted semantic colours, so
# ls, git and compiler output stay readable without turning into a rainbow.
foreground #c9c5d4
background #0d0c10
selection_foreground #ecebf2
selection_background #2b2540
cursor #b49cf0
cursor_text_color #0d0c10
url_color #cdbcf7
color0  #131218
color8  #948fa3
color1  #d9786c
color9  #dca598
color2  #83b48f
color10 #a8cbae
color3  #d99f66
color11 #e3c299
color4  #5e9bb4
color12 #91b9c9
color5  #b49cf0
color13 #cdbcf7
color6  #75aaa4
color14 #a0c8c4
color7  #c9c5d4
color15 #ecebf2

# 180 Hz: one frame is 5.6 ms
repaint_delay 5
input_delay 1
sync_to_monitor yes

# notification when a command over 15 s finishes while you look elsewhere
notify_on_cmd_finish unfocused 15

# Tabs (ctrl+shift+t): slanted tabs at the top, the rice's 45 degree cut,
# numbered, the active one in violet; a tab with activity in the background
# gets a small violet mark, one with a bell an amber one.
tab_bar_edge top
tab_bar_margin_width 8
tab_bar_margin_height 8 2
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_activity_symbol "● "
bell_on_tab "● "
tab_title_max_length 32
tab_title_template " {index} {fmt.fg._b49cf0}{activity_symbol}{fmt.fg.tab}{bell_symbol}{title} "
active_tab_title_template " {index} {title} "
tab_bar_background #0d0c10
active_tab_foreground #0d0c10
active_tab_background #b49cf0
active_tab_font_style bold
inactive_tab_foreground #948fa3
inactive_tab_background #1b1a22
inactive_tab_font_style normal
