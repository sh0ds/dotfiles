# ~/.config/tmux/tmux.conf
# Prefix is Ctrl+a (closer than Ctrl+b). Press it, release, then the key.

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Terminal: true colour in kitty, no Escape delay (nvim feels laggy without this)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on

# Behaviour
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-time 2000
setw -g mode-keys vi
set -g status-keys emacs

# Reload this file
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Splits keep the current directory: | side by side, - stacked
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane movement with vim keys, resize with capitals (hold to repeat)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt+1..5 jumps straight to a window, no prefix
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6

# Copy mode: prefix [ , v to select, y to copy to the Wayland clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Status bar (Catppuccin Mocha)
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] "
set -g status-right "#[fg=#a6adc8]#{?client_prefix,#[fg=#f9e2af]PREFIX ,}#H  %H:%M "
setw -g window-status-format "#[fg=#6c7086] #I #W "
setw -g window-status-current-format "#[bg=#313244,fg=#cba6f7,bold] #I #W "
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"
