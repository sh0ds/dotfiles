# ~/.config/aria2/aria2.conf: defaults for aria2c (and the dl script).
# 16 connections per file, so slow servers that cap each connection go a lot faster.
max-connection-per-server=16
split=16
min-split-size=1M
# Run the same command again and it picks up where it stopped
continue=true
# Reserve the space up front so big files don't end up in pieces all over the disk
file-allocation=falloc
# Quiet: one progress line, no download summary every minute
summary-interval=0
console-log-level=warn

# Torrents (torrent, magnet links, .torrent files; they all go to aria2-rpc).
# One fixed port for peers (TCP) and DHT (UDP), so the firewall needs one rule:
#   sudo ufw allow 6881/tcp && sudo ufw allow 6881/udp
listen-port=6881
dht-listen-port=6881
# Seed until as much went up as came down, then stop.
seed-ratio=1.0
# A .torrent link (from Firefox or dl) starts the torrent; the .torrent file itself isn't kept
follow-torrent=mem
