# Game-plan stack. C/clangd and Bash use Helix defaults.
[language-server.lua-language-server]
command = "lua-language-server"

[[language]]
name = "lua"
language-servers = ["lua-language-server"]

# Godot provides its GDScript language server while the editor is open.
# Keep this on localhost; do not expose the editor service to the network.
[language-server.godot]
command = "nc"
args = ["127.0.0.1", "6005"]

[[language]]
name = "gdscript"
language-servers = ["godot"]
