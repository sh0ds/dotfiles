# ~/.config/mpd/mpd.conf: the music daemon behind rmpc (SUPER+U).
# Drop files into ~/Music and they show up on their own.
music_directory     "~/Music"
playlist_directory  "~/.local/share/mpd/playlists"
db_file             "~/.local/share/mpd/database"
state_file          "~/.local/share/mpd/state"
sticker_file        "~/.local/share/mpd/sticker.sql"

# Only this PC can talk to it, not the whole network.
bind_to_address     "127.0.0.1"
auto_update         "yes"
restore_paused      "yes"

audio_output {
    type    "pipewire"
    name    "PipeWire"
}
