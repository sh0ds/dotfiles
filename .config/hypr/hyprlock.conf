# Afterhours lock screen: the same picture as the login screen
# (system/sddm/afterhours/Main.qml). The wallpaper, a large light clock with
# the date under it, your name as a chip, and one square password field that
# turns violet while you type and coral on a wrong password.
$font = JetBrainsMono Nerd Font
$light = JetBrainsMono Nerd Font Light

general {
    hide_cursor = true
}
background {
    monitor =
    path = ~/.local/share/backgrounds/afterhours-haze.jpg
    color = rgb(0d0c10)
}
animations {
    enabled = true
    bezier = settle, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 3, settle
    animation = fadeOut, 1, 2, settle
    animation = inputFieldColors, 1, 2, settle
    animation = inputFieldFade, 1, 2, settle
}

# Clock and date
label {
    monitor =
    text = $TIME
    color = rgb(e0dde8)
    font_size = 84
    font_family = $light
    position = 0, 150
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date '+%A · %-d %B'
    color = rgb(948fa3)
    font_size = 13
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
}

# Who: a square chip with your name, like the login screen
shape {
    monitor =
    size = 150, 40
    color = rgba(131218d9)
    rounding = 0
    border_size = 1
    border_color = rgb(35323f)
    position = 0, 0
    halign = center
    valign = center
}
label {
    monitor =
    text = <span foreground="##b49cf0">󰀄</span>  $USER
    color = rgb(e0dde8)
    font_size = 12
    font_family = $font
    position = 0, 0
    halign = center
    valign = center
}

# The password field
input-field {
    monitor =
    size = 360, 52
    outline_thickness = 1
    rounding = 0
    inner_color = rgba(131218eb)
    outer_color = rgb(35323f)
    check_color = rgb(b49cf0) rgb(8f7ad9) 45deg
    fail_color = rgb(d9786c)
    capslock_color = rgb(d99f66)
    font_color = rgb(e0dde8)
    fade_on_empty = false
    font_family = $font
    placeholder_text = <span foreground="##948fa3">  password</span>
    fail_text = <span foreground="##d9786c">wrong password, try again</span>
    dots_size = 0.2
    dots_spacing = 0.45
    dots_rounding = 0
    dots_center = true
    position = 0, -62
    halign = center
    valign = center
}

# Corners: the host top right, what's playing bottom right
label {
    monitor =
    text = cmd[update:0] printf '  %s' "$(cat /etc/hostname)"
    color = rgb(948fa3)
    font_size = 11
    font_family = $font
    position = -40, -36
    halign = right
    valign = top
}
label {
    monitor =
    text = cmd[update:2000] ~/.local/bin/np-title
    color = rgb(948fa3)
    font_size = 11
    font_family = $font
    position = -40, 40
    halign = right
    valign = bottom
}
