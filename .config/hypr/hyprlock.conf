# ~/.config/hypr/hyprlock.conf  (Amethyst)
# Black screen: user, kernel and uptime, the clock, one password: prompt and
# what's playing. No blur, no fade.
# Clear a mistyped password: Esc, Ctrl+U or Ctrl+Backspace.

$font = Terminess Nerd Font

general {
    hide_cursor = true
}

# Fade in and out in 150 ms, the field changes colour (typing, wrong
# password) in 120 ms. It never resizes and the dots just appear.
animations {
    enabled = true
    bezier = lin, 0, 0, 1, 1
    animation = fadeIn, 1, 1.5, lin
    animation = fadeOut, 1, 1.5, lin
    animation = inputFieldColors, 1, 1.2, lin
    animation = inputFieldFade, 1, 1.2, lin
    animation = inputFieldWidth, 0, 1, lin
    animation = inputFieldDots, 0, 1, lin
}

background {
    monitor =
    color = rgb(000000)
}

label {
    monitor =
    text = cmd[update:60000] echo "$USER@$(hostname)  ·  $(uname -r)  ·  $(uptime -p)"
    color = rgb(7f7494)
    font_size = 14
    font_family = $font
    position = 0, 175
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%Y-%m-%d'
    color = rgb(5e5270)
    font_size = 13
    font_family = $font
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(ece4fb)
    font_size = 72
    font_family = $font
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 34
    outline_thickness = 1
    rounding = 0
    inner_color = rgb(000000)
    outer_color = rgb(2b2238)
    check_color = rgb(b06cff)
    fail_color = rgb(e0607a)
    font_color = rgb(ece4fb)
    fade_on_empty = false
    font_family = $font
    placeholder_text = <span foreground="##5e5270">password:</span>
    fail_text = nope. $PAMFAIL ($ATTEMPTS)
    dots_size = 0.25
    dots_spacing = 0.4
    dots_rounding = 0
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] [ "$(date +%H)" -lt 5 ] && echo "it's late. go to bed."
    color = rgb(b06cff)
    font_size = 13
    font_family = $font
    position = 0, -70
    halign = center
    valign = center
}

# Now playing, under the prompt.
label {
    monitor =
    text = cmd[update:2000] ~/.local/bin/np-title
    color = rgb(7f7494)
    font_size = 13
    font_family = $font
    position = 0, -110
    halign = center
    valign = center
}
