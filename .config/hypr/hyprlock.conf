# Afterhours lock screen. A real PAM-backed lock remains outside shell UI.
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}
background {
    monitor =
    color = rgb(0c0d0b)
}
animations {
    enabled = true
    bezier = settle, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 2, settle
    animation = fadeOut, 1, 1.5, settle
}
label {
    monitor =
    text = AFTERHOURS / SH0DS·16
    color = rgb(b4c97f)
    font_size = 16
    font_family = $font
    position = 48, -48
    halign = left
    valign = top
}
label {
    monitor =
    text = $TIME
    color = rgb(dfe3d8)
    font_size = 80
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 340, 52
    outline_thickness = 1
    rounding = 14
    inner_color = rgb(121411)
    outer_color = rgb(343c31)
    check_color = rgb(b4c97f)
    fail_color = rgb(d9786c)
    font_color = rgb(dfe3d8)
    fade_on_empty = false
    font_family = $font
    placeholder_text = resume session
    fail_text = try again ($ATTEMPTS)
    dots_size = 0.22
    dots_spacing = 0.35
    dots_rounding = -1
    position = 0, -30
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date '+%A · %d %B'
    color = rgb(929c8a)
    font_size = 13
    font_family = $font
    position = 0, -94
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:2000] ~/.local/bin/np-title
    color = rgb(929c8a)
    font_size = 12
    font_family = $font
    position = 48, 40
    halign = left
    valign = bottom
}
