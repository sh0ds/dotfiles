# ~/.config/hypr/hyprlock.conf
# Based on the upstream hyprlock example, recoloured to Catppuccin Mocha.
# Clear a mistyped password: Esc, Ctrl+U or Ctrl+Backspace.

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, linear
    animation = fadeOut, 1, 4, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    brightness = 0.6
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(1e1e2ecc)
    outer_color = rgba(89b4faee) rgba(cba6f7ee) 45deg
    check_color = rgba(a6e3a1ee) rgba(94e2d5ee) 120deg
    fail_color = rgba(f38ba8ee) rgba(fab387ee) 40deg
    font_color = rgb(cdd6f4)
    fade_on_empty = false
    rounding = 12
    font_family = $font
    placeholder_text = password
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(cdd6f4)
    font_size = 90
    font_family = $font
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb(a6adc8)
    font_size = 22
    font_family = $font
    position = 0, 110
    halign = center
    valign = center
}
