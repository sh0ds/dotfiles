# ~/.config/hypr/hyprlock.conf  (Diag)
# Laid out like the header of sh0ds.dev, which copies the Pi 5's boot
# screen: a pixel Arch logo top left with diagnostic lines next to it, the
# clock and one password: prompt in the middle, what's playing bottom left.
# Keys in Arch blue, values in white. No blur.
# Clear a mistyped password: Esc, Ctrl+U or Ctrl+Backspace.

$font = VT323

general {
    hide_cursor = true
}

# Fade in and out in 150 ms, the field changes colour (typing, wrong
# password) in 120 ms. It never resizes and the dots just appear.
animations {
    enabled = true
    bezier = lin, 0, 0, 1, 1
    animation = fadeIn, 1, 1.5, lin
    animation = fadeOut, 1, 1.5, lin
    animation = inputFieldColors, 1, 1.2, lin
    animation = inputFieldFade, 1, 1.2, lin
    animation = inputFieldWidth, 0, 1, lin
    animation = inputFieldDots, 0, 1, lin
}

background {
    monitor =
    color = rgb(000000)
}

# ---- Header: logo (46 x 46 pixels at 3x) and three lines as tall as it ----
image {
    monitor =
    path = ~/.config/hypr/arch-logo.png
    size = 138
    rounding = 0
    border_size = 0
    position = 48, -40
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] echo "Arch Linux $(uname -m)  $(date +%Y-%m-%d)"
    color = rgb(8a929c)
    font_size = 22
    font_family = $font
    position = 214, -38
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] printf '%s %s\n%s %s\n%s %s' '<span foreground="##1793d1">host:</span>' "$USER@$(hostname)" '<span foreground="##1793d1">kern:</span>' "$(uname -r)" '<span foreground="##1793d1">up:</span>' "$(uptime -p | sed 's/^up //')"
    color = rgb(e6e8ea)
    font_size = 22
    font_family = $font
    position = 214, -84
    halign = left
    valign = top
}

# ---- Middle: the clock and the prompt ----
label {
    monitor =
    text = $TIME
    color = rgb(ffffff)
    font_size = 110
    font_family = $font
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 40
    outline_thickness = 2
    rounding = 0
    inner_color = rgb(000000)
    outer_color = rgb(3f4650)
    check_color = rgb(1793d1)
    fail_color = rgb(e5484d)
    font_color = rgb(ffffff)
    fade_on_empty = false
    font_family = $font
    placeholder_text = <span foreground="##1793d1">password:</span>
    fail_text = <span foreground="##e5484d">fail:</span> $PAMFAIL ($ATTEMPTS)
    dots_size = 0.3
    dots_spacing = 0.35
    dots_rounding = 0
    position = 0, -30
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] [ "$(date +%H)" -lt 5 ] && echo '<span foreground="##ffb000">warn:</span> it'"'"'s late. go to bed.'
    color = rgb(e6e8ea)
    font_size = 20
    font_family = $font
    position = 0, -85
    halign = center
    valign = center
}

# ---- Bottom left: what's playing, as one more diagnostic line ----
label {
    monitor =
    text = cmd[update:2000] ~/.local/bin/np-title
    color = rgb(e6e8ea)
    font_size = 20
    font_family = $font
    position = 48, 36
    halign = left
    valign = bottom
}
