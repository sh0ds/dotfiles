# ~/.config/hypr/xdph.conf  (xdg-desktop-portal-hyprland 1.4.1)
# Screen sharing for Discord/Vesktop, Firefox and OBS.
# Apply changes with: systemctl --user restart xdg-desktop-portal-hyprland
screencopy {
    # Fuzzel picker instead of the Qt window: Enter shares the focused
    # monitor, or pick a single window or a dragged region.
    custom_picker_binary = /home/sh0ds/.local/bin/share-picker
    # Apps may keep a restore token and reconnect without asking again.
    allow_token_by_default = true
    # Discord streams at 60 fps at most (30 without Nitro). Capturing a
    # 144 Hz monitor at 144 fps only burns CPU and GPU time on frames it
    # throws away. Default is 120.
    max_fps = 60
}
