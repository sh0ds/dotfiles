# Afterhours for eza: files grey, directories blue; colour conveys type/status.
# Environment mappings are reset by diag/ls-colors.sh to avoid inherited themes.
filekinds:
  normal:
    foreground: '#c9c5d4'
  directory:
    foreground: '#b49cf0'
    is_bold: true
  symlink:
    foreground: '#cdbcf7'
  pipe:
    foreground: '#d99f66'
  block_device:
    foreground: '#d99f66'
  char_device:
    foreground: '#d99f66'
  socket:
    foreground: '#b49cf0'
  special:
    foreground: '#d99f66'
  executable:
    foreground: '#83b48f'
  mount_point:
    foreground: '#b49cf0'
    is_bold: true
