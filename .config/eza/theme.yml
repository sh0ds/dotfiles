# Diag for eza: files grey, directories blue; colour conveys type/status.
# Environment mappings are reset by diag/ls-colors.sh to avoid inherited themes.
filekinds:
  normal:
    foreground: '#c4c9ce'
  directory:
    foreground: '#1793d1'
    is_bold: true
  symlink:
    foreground: '#5fb8e8'
  pipe:
    foreground: '#ffb000'
  block_device:
    foreground: '#ffb000'
  char_device:
    foreground: '#ffb000'
  socket:
    foreground: '#1793d1'
  special:
    foreground: '#ffb000'
  executable:
    foreground: '#75c94d'
  mount_point:
    foreground: '#1793d1'
    is_bold: true
