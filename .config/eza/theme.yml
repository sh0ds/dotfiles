# Diag for eza: files grey, directories blue; colour conveys type/status.
# Environment mappings are reset by diag/ls-colors.sh to avoid inherited themes.
filekinds:
  normal:
    foreground: '#d8dfd0'
  directory:
    foreground: '#c6db91'
    is_bold: true
  symlink:
    foreground: '#deecb9'
  pipe:
    foreground: '#e9b078'
  block_device:
    foreground: '#e9b078'
  char_device:
    foreground: '#e9b078'
  socket:
    foreground: '#c6db91'
  special:
    foreground: '#e9b078'
  executable:
    foreground: '#95c7a1'
  mount_point:
    foreground: '#c6db91'
    is_bold: true
perms:
  user_read:
    foreground: '#d8dfd0'
