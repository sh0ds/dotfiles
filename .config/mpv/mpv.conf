# ~/.config/mpv/mpv.conf: videos from yazi, Firefox downloads and ~/Videos.
# Opened from kitty, mpv takes the terminal's place (swallow, rice.lua).
hwdec=auto-safe
vo=gpu-next
# Stay on the last frame instead of closing, and resume where you quit.
keep-open=yes
save-position-on-quit=yes
screenshot-dir=~/Pictures
osd-font='Terminess Nerd Font'
sub-auto=fuzzy

# Diag
background-color='#000000'
osd-back-color='#000000'
osd-border-color='#000000'
osd-color='#e6e8ea'
osd-shadow-color='#000000'

# Stats script options
# Options are on separate lines for clarity
# Colors are in #BBGGRR format
script-opts-append=stats-font='Terminess Nerd Font'
script-opts-append=stats-border_color=000000
script-opts-append=stats-font_color=eae8e6
script-opts-append=stats-plot_bg_border_color=50463f
script-opts-append=stats-plot_bg_color=1f1a16
script-opts-append=stats-plot_color=d19317
