# Prompt: Diag, one plain line. Path in blue, git and languages in
# grey, the time at the end. No powerline blocks, no icons. The language
# segments are the site's languages (C, Haskell, Erlang) plus Python.
# kitty sends the "command finished" notifications.
"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$directory\
$git_branch\
$git_status\
$c\
$haskell\
$erlang\
$python\
$cmd_duration\
${custom.friday}\
${custom.leet}\
$time\
$line_break\
$character"""

palette = 'diag'

[username]
show_always = false
style_user = "fg:mid"
style_root = "bold fg:error"
format = '[$user ]($style)'

[directory]
style = "fg:arch"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "fg:mid"
format = '[$branch]($style)'

[git_status]
style = "fg:mid"
format = '[$all_status$ahead_behind]($style) '

[c]
style = "fg:dim"
format = '[c( $version)]($style) '

[erlang]
style = "fg:dim"
format = '[erl( $version)]($style) '

[haskell]
style = "fg:dim"
format = '[ghc( $version)]($style) '

[python]
style = "fg:dim"
format = '[py( $version)(\($virtualenv\))]($style) '

[cmd_duration]
show_milliseconds = true
style = "fg:dim"
format = "[took $duration]($style) "

[custom.friday]
when = 'test "$(date +%u)" = 5'
format = "[it's friday ](fg:arch)"

[custom.leet]
when = 'test "$(date +%H%M)" = 1337'
format = "[leet ](fg:arch)"

[time]
disabled = false
time_format = "%R"
style = "fg:dim"
format = '[$time]($style)'

[line_break]
disabled = true

[character]
disabled = false
format = " $symbol "
success_symbol = '[\$](fg:arch)'
error_symbol = '[\$](fg:error)'
vimcmd_symbol = '[:](fg:arch)'
vimcmd_replace_one_symbol = '[r](fg:arch)'
vimcmd_replace_symbol = '[R](fg:arch)'
vimcmd_visual_symbol = '[v](fg:arch)'

[palettes.diag]
dim = "#5d6670"
mid = "#8a929c"
fg = "#c4c9ce"
bright = "#f4f6f8"
arch = "#1793d1"
error = "#e5484d"
