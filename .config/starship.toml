# Diag prompt: a compact instrument line, then a clear input cursor.
# Nerd Font icons share kitty's Terminess / Symbols Nerd Font fallback.
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
palette = 'diag'
format = """
$directory\
$git_branch\
$git_status\
$c\
$haskell\
$erlang\
$python\
$cmd_duration\
$time\
$line_break\
$username\
$hostname\
$character"""

[directory]
style = 'bold fg:bright'
format = '[ ](fg:arch)[$path]($style)[$read_only](fg:error) '
read_only = ' '
truncation_length = 3
truncate_to_repo = true
truncation_symbol = '…/'

[git_branch]
symbol = ' '
style = 'fg:arch'
format = '[$symbol$branch]($style) '

[git_status]
style = 'fg:mid'
format = '([$all_status$ahead_behind]($style) )'
ahead = '↑${count}'
behind = '↓${count}'
diverged = '↕${ahead_count}/${behind_count}'
conflicted = '=${count}'
untracked = '?${count}'
# Single-quoted TOML preserves this escape for Starship's format parser.
stashed = '\$${count}'
modified = '!${count}'
staged = '+${count}'
renamed = 'r${count}'
deleted = 'x${count}'
typechanged = '~${count}'

[c]
symbol = ' '
style = 'fg:mid'
format = '[$symbol($version)]($style) '
version_format = '${major}.${minor}'

[haskell]
symbol = ' '
style = 'fg:mid'
format = '[$symbol($version)]($style) '
version_format = '${major}.${minor}'

[erlang]
symbol = ' '
style = 'fg:mid'
format = '[$symbol($version)]($style) '

[python]
symbol = ' '
style = 'fg:mid'
format = '[$symbol($version)( · $virtualenv)]($style) '
version_format = '${major}.${minor}'

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = 'fg:mid'
format = '[󱎫 $duration]($style) '

[time]
disabled = false
time_format = '%H:%M'
style = 'fg:mid'
format = '[󰥔 $time]($style)'

[line_break]
disabled = false

[username]
show_always = false
style_user = 'fg:mid'
style_root = 'bold fg:error'
format = '[$user]($style) '

[hostname]
ssh_only = true
style = 'fg:mid'
format = '[󰒋 $hostname]($style) '

[character]
format = '$symbol '
success_symbol = '[❯](fg:arch)'
error_symbol = '[❯](fg:error)'
vimcmd_symbol = '[❮](fg:arch)'
vimcmd_replace_one_symbol = '[r](fg:error)'
vimcmd_replace_symbol = '[R](fg:error)'
vimcmd_visual_symbol = '[v](fg:arch)'

[palettes.diag]
mid = '#8a929c'
bright = '#e6e8ea'
arch = '#1793d1'
error = '#e5484d'
