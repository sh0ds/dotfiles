# Afterhours prompt, drawn like the rail. A thin bracket in the line colour
# holds two lines. Line one: the Arch mark in violet, the path with the
# repo's own folder bright and everything above it dim, "on" and the branch
# in violet, changes in amber, language versions quiet, then a dotted rule
# to the right edge where a slow command's time and the clock sit, split by
# a hairline. Line two: the violet arrow (coral after a failed command).
# Icons come from kitty's JetBrains Mono Nerd Font.
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
palette = 'afterhours'
format = """
[┌─](fg:line) [](fg:accent) $username$hostname$directory$git_branch$git_status$c$lua$python$fill $cmd_duration$time
[└─](fg:line)$character"""

[fill]
symbol = '·'
style = 'fg:line'

[directory]
style = 'fg:muted'
format = '[$path]($style)[$read_only]($read_only_style) '
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) '
before_repo_root_style = 'fg:muted'
repo_root_style = 'bold fg:text'
read_only_style = 'fg:danger'
home_symbol = '~'
read_only = ' 󰌾'
truncation_length = 4
truncate_to_repo = false
truncation_symbol = '…/'

[git_branch]
symbol = ' '
style = 'fg:accent'
format = '[on](fg:line) [$symbol$branch]($style) '

[git_status]
style = 'fg:amber'
format = '([$all_status$ahead_behind]($style) )'
ahead = '↑${count}'
behind = '↓${count}'
diverged = '↕${ahead_count}/${behind_count}'
conflicted = '=${count}'
untracked = '?${count}'
# Single-quoted TOML preserves this escape for Starship's format parser.
stashed = '\$${count}'
modified = '!${count}'
staged = '+${count}'
renamed = 'r${count}'
deleted = 'x${count}'
typechanged = '~${count}'

[c]
symbol = ' '
style = 'fg:muted'
format = '[$symbol($version)]($style) '
version_format = '${major}.${minor}'

[lua]
symbol = ' '
style = 'fg:muted'
format = '[$symbol($version)]($style) '
version_format = '${major}.${minor}'

[python]
symbol = ' '
style = 'fg:muted'
format = '[$symbol($version)( · $virtualenv)]($style) '
version_format = '${major}.${minor}'

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = 'fg:amber'
format = '[$duration]($style) [│](fg:line) '

[time]
disabled = false
time_format = '%H:%M'
style = 'fg:muted'
format = '[$time]($style)'

[line_break]
disabled = false

[username]
show_always = false
style_user = 'fg:muted'
style_root = 'bold fg:danger'
format = '[$user]($style) '

[hostname]
ssh_only = true
style = 'fg:accent'
format = '[󰒋 $hostname]($style) '

[character]
format = '$symbol '
success_symbol = '[❯](bold fg:accent)'
error_symbol = '[❯](bold fg:danger)'
vimcmd_symbol = '[❮](bold fg:accent)'
vimcmd_replace_one_symbol = '[r](fg:danger)'
vimcmd_replace_symbol = '[R](fg:danger)'
vimcmd_visual_symbol = '[v](fg:accent)'

[palettes.afterhours]
line = '#35323f'
muted = '#948fa3'
text = '#e0dde8'
accent = '#b49cf0'
blue = '#5e9bb4'
amber = '#d99f66'
danger = '#d9786c'
