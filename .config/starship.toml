# Afterhours prompt: where you are and what branch on the first line, a
# phosphor arrow to type after. Timing and the clock sit on the right.
# Icons come from kitty's JetBrains Mono Nerd Font.
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
palette = 'afterhours'
format = """
[╭─](fg:line)$directory$git_branch$git_status$c$lua$python$line_break\
[╰─](fg:line)$username$hostname$character"""
right_format = '$cmd_duration$time'

[directory]
style = 'bold fg:text'
format = '[ ](fg:accent)[$path]($style)[$read_only](fg:danger) '
read_only = ' '
truncation_length = 3
truncate_to_repo = true
truncation_symbol = '…/'

[git_branch]
symbol = ' '
style = 'fg:blue'
format = '[$symbol$branch]($style) '

[git_status]
style = 'fg:amber'
format = '([$all_status$ahead_behind]($style) )'
ahead = '↑${count}'
behind = '↓${count}'
diverged = '↕${ahead_count}/${behind_count}'
conflicted = '=${count}'
untracked = '?${count}'
# Single-quoted TOML preserves this escape for Starship's format parser.
stashed = '\$${count}'
modified = '!${count}'
staged = '+${count}'
renamed = 'r${count}'
deleted = 'x${count}'
typechanged = '~${count}'

[c]
symbol = ' '
style = 'fg:muted'
format = '[$symbol($version)]($style) '
version_format = '${major}.${minor}'

[lua]
symbol = ' '
style = 'fg:muted'
format = '[$symbol($version)]($style) '
version_format = '${major}.${minor}'

[python]
symbol = ' '
style = 'fg:muted'
format = '[$symbol($version)( · $virtualenv)]($style) '
version_format = '${major}.${minor}'

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = 'fg:amber'
format = '[󱎫 $duration]($style) '

[time]
disabled = false
time_format = '%H:%M'
style = 'fg:muted'
format = '[󰥔 $time]($style)'

[line_break]
disabled = false

[username]
show_always = false
style_user = 'fg:muted'
style_root = 'bold fg:danger'
format = '[$user]($style) '

[hostname]
ssh_only = true
style = 'fg:blue'
format = '[󰒋 $hostname]($style) '

[character]
format = '$symbol '
success_symbol = '[❯](bold fg:accent)'
error_symbol = '[❯](bold fg:danger)'
vimcmd_symbol = '[❮](bold fg:accent)'
vimcmd_replace_one_symbol = '[r](fg:danger)'
vimcmd_replace_symbol = '[R](fg:danger)'
vimcmd_visual_symbol = '[v](fg:accent)'

[palettes.afterhours]
line = '#343c31'
muted = '#929c8a'
text = '#dfe3d8'
accent = '#b4c97f'
blue = '#5e9bb4'
amber = '#d99f66'
danger = '#d9786c'
