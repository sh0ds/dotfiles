; ~/.config/gamemode.ini: Feral GameMode. rice.lua turns it on for every
; Steam game as soon as its window opens. Games get the performance CPU governor and a
; higher priority (that part needs the gamemode group, see the README), and
; notifications stay quiet until the game closes.
[general]
renice=10
inhibit_screensaver=1

[custom]
start=swaync-client -dn
end=swaync-client -df
