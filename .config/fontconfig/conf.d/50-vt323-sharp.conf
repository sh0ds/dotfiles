<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- VT323 is pixel art, so draw it without smoothing: every pixel is either
     on or off. At 25 px (and 50, 75, ...) it's exact; at any other size the
     odd column doubles instead of the whole font going soft. Only VT323,
     every other font keeps its antialiasing. -->
<fontconfig>
  <match target="font">
    <test name="family"><string>VT323</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>
</fontconfig>
