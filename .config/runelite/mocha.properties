# RuneLite profile in Catppuccin Mocha, with the plugins I use.
# Import it in RuneLite: wrench icon > the person icon at the top (Profiles)
# > Import Profile, pick this file, then switch to "Imported Profile" and
# restart RuneLite so the Plugin Hub plugins download.
# Colours are stored the way RuneLite saves them (ARGB as a signed number).

# Window: Hyprland draws the border, so no RuneLite title bar. No Java tray
# icon (waybar can't show it). Notifications go to swaync like everything else.
runelite.uiEnableCustomChrome=false
runelite.trayIcon=false
runelite.notificationTray=true
runelite.notificationFocused=false
runelite.flashNotification=DISABLED
runelite.overlayBackgroundColor=-937550290

# Plugin Hub plugins: quests, gear setups, walking routes, where your
# stuff is, and interface skins.
runelite.externalPlugins=quest-helper,inventory-setups,shortest-path,dude-wheres-my-stuff,resource-packs

# GPU rendering: the normal look, just smoother and further. Double the
# default draw distance, smoother edges and sharper ground textures.
runelite.gpuplugin=true
gpu.drawDistance=90
gpu.smoothBanding=true
gpu.antiAliasingMode=MSAA_4
gpu.anisotropicFilteringLevel=16

# Built-in plugins that are off by default
runelite.idlenotifierplugin=true
runelite.tileindicatorsplugin=true
runelite.xpglobesplugin=true

# Ground items: value tiers in Mocha (blue, green, peach, pink), mauve for
# your own highlights, greyed out for hidden ones.
grounditems.defaultColor=-3287308
grounditems.highlightedColor=-3430665
grounditems.hiddenColor=-9670522
grounditems.lowValueColor=-7752454
grounditems.mediumValueColor=-5839967
grounditems.highValueColor=-347257
grounditems.insaneValueColor=-671001

# Where you clicked to walk: a mauve tile
tileindicators.highlightDestinationTile=true
tileindicators.highlightDestinationColor=-3430665
tileindicators.destinationTileFillColor=852207351

# XP globes: mauve progress ring on a Mocha background
xpglobes.enableCustomArcColor=true
xpglobes.Progress\ arc\ color=-3430665
xpglobes.Progress\ orb\ outline\ color=-15658725
xpglobes.Progress\ orb\ background\ color=2132680238
