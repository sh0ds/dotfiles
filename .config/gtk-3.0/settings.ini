# GTK 3 apps (Thunar, pavucontrol, virt-viewer, file pickers): dark adw-gtk3,
# recoloured to Afterhours in gtk.css next to this file.
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Posy_Cursor_Black
gtk-cursor-theme-size=32
gtk-font-name=JetBrainsMono Nerd Font 10
