# ~/.config/fuzzel/fuzzel.ini  (Diag)
# Like a file list on sh0ds.dev: Terminess, the prompt is a blue "load:" key,
# the selected line is a soft blue pill on a rounded glass panel.
[main]
font=Terminess Nerd Font:pixelsize=18
terminal=kitty -e
prompt="load: "
width=48
lines=10
horizontal-pad=16
vertical-pad=12
line-height=28

[colors]
background=0d1014d9
text=e6e8eaff
prompt=1793d1ff
placeholder=8a929cff
input=ffffffff
match=1793d1ff
selection=1793d14d
selection-text=e6e8eaff
selection-match=6cc4f0ff
border=3f465080

[border]
width=1
radius=14
selection-radius=8
