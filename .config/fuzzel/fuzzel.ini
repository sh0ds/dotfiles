# ~/.config/fuzzel/fuzzel.ini  (Diag)
# Like a file list on sh0ds.dev: Terminess, the prompt is a blue "load:" key,
# the selected line inverts to an Arch blue block.
[main]
font=Terminess Nerd Font:pixelsize=20
terminal=kitty -e
prompt="load: "
width=52
lines=12
horizontal-pad=14
vertical-pad=10
line-height=30

[colors]
background=000000ff
text=e6e8eaff
prompt=1793d1ff
placeholder=5d6670ff
input=ffffffff
match=1793d1ff
selection=1793d1ff
selection-text=000000ff
selection-match=000000ff
border=3f4650ff

[border]
width=2
radius=0
