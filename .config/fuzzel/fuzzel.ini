# ~/.config/fuzzel/fuzzel.ini  (Diag)
# Like a file list on sh0ds.dev: Terminess, the prompt is a blue "load:" key,
# the selected line inverts to an Arch blue block.
[main]
font=Terminess Nerd Font:pixelsize=18
terminal=kitty -e
prompt="load: "
width=48
lines=10
horizontal-pad=16
vertical-pad=12
line-height=28

[colors]
background=000000ff
text=e6e8eaff
prompt=1793d1ff
placeholder=8a929cff
input=ffffffff
match=1793d1ff
selection=1793d1ff
selection-text=000000ff
selection-match=000000ff
border=3f4650ff

[border]
width=2
radius=0
