# Three mailboxes, each a tab in aerc. Passwords come from the keyring:
#   secret-tool store --label="mail: proton" aerc proton
# (and the same for sh0ds-mail and sh0ds-security), see the README.

# Proton Mail through Proton Mail Bridge, which runs on this machine. Bridge
# signs its connection with its own certificate, so the check is skipped:
# the traffic never leaves 127.0.0.1. Set both connection modes in Bridge to SSL.
[Proton]
source            = imaps+insecure://tizianweik%40pm.me@127.0.0.1:1143
source-cred-cmd   = secret-tool lookup aerc proton
outgoing          = smtps+insecure://tizianweik%40pm.me@127.0.0.1:1025
outgoing-cred-cmd = secret-tool lookup aerc proton
from              = Tizian <tizianweik@pm.me>
copy-to           = Sent
folders-sort      = INBOX,Drafts,Sent,Archive,Spam,Trash
check-mail        = 2m
default           = INBOX

[sh0ds.dev]
source            = imaps://mail%40sh0ds.dev@imap.ionos.de:993
source-cred-cmd   = secret-tool lookup aerc sh0ds-mail
outgoing          = smtps://mail%40sh0ds.dev@smtp.ionos.de:465
outgoing-cred-cmd = secret-tool lookup aerc sh0ds-mail
from              = Tizian <mail@sh0ds.dev>
copy-to           = Gesendete Objekte
folders-sort      = INBOX,Entwürfe,Gesendete Objekte,Spam,Papierkorb
check-mail        = 2m
default           = INBOX

[security]
source            = imaps://security%40sh0ds.dev@imap.ionos.de:993
source-cred-cmd   = secret-tool lookup aerc sh0ds-security
outgoing          = smtps://security%40sh0ds.dev@smtp.ionos.de:465
outgoing-cred-cmd = secret-tool lookup aerc sh0ds-security
from              = sh0ds.dev security <security@sh0ds.dev>
copy-to           = Gesendete Objekte
folders-sort      = INBOX,Entwürfe,Gesendete Objekte,Spam,Papierkorb
check-mail        = 5m
default           = INBOX
