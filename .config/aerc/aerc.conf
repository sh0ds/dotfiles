# aerc: mail in the terminal (SUPER+SHIFT+I, ~/.local/bin/inbox).
# Accounts are in accounts.conf, passwords in the keyring (see the README).

[general]
# accounts.conf holds no passwords (they come from secret-tool), and as a
# symlink into this repo it can't be chmod 600, so skip aerc's check.
unsafe-accounts-conf = true

[ui]
styleset-name = amethyst
border-char-vertical = "│"
border-char-horizontal = "─"
spinner = "⠋,⠙,⠹,⠸,⠼,⠴,⠦,⠧,⠇,⠏"
timestamp-format = 02.01. 15:04
this-day-time-format = 15:04
threading-enabled = true
sidebar-width = 22
mouse-enabled = true
icon-attachment = 󰁦
icon-encrypted = 󰌾
icon-signed = 󰏫

[compose]
# Written in $EDITOR (nvim). Warns about an empty subject, and when the mail
# mentions an attachment that isn't there.
empty-subject-warning = true
no-attachment-warning = ^[^>]*(attach(ed|ment)|anhang|angehängt)

[filters]
text/plain = colorize
text/calendar = calendar
message/delivery-status = colorize
message/rfc822 = colorize
# HTML mails through w3m, with the network cut off so tracking pixels never load
text/html = ! html
.headers = colorize

[hooks]
# New mail as a notification, named after the account. Clicking it slides
# aerc in (same as SUPER+SHIFT+I). Detached, so aerc never waits for the click.
mail-received = setsid -f sh -c '[ "$(notify-send -a "$AERC_ACCOUNT" -i mail-unread --action=default=Open "$AERC_FROM_NAME" "$AERC_SUBJECT")" = default ] && inbox' >/dev/null 2>&1
