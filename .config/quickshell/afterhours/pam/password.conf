# PAM for the Afterhours lock screen: check the password like login does,
# nothing else (no session, no account changes).
# The lock screen is also the login (SDDM logs in by itself), so the right
# password unlocks the gnome-keyring too, like SDDM's login used to. The
# leading - skips the line when gnome-keyring isn't installed.
auth required pam_unix.so
-auth optional pam_gnome_keyring.so
