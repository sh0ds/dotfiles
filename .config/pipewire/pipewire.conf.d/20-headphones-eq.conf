# "Headphones EQ": an output that sits in front of the headphones and corrects
# the Corsair Virtuoso RGB Wireless XT to the Harman target, the curve most
# people hear as full and natural (warm low end, clear vocals, no harshness).
# AutoEQ's parametric result from Rtings' measurement:
# github.com/jaakkopasanen/AutoEq/tree/master/results/Rtings/HMS%20II.3%20over-ear/Corsair%20VIRTUOSO%20RGB%20Wireless%20XT
# The preamp turns everything down 6.3 dB first so the boosts never clip, so
# turn the volume up a bit to match.
# Make it the default once: pactl set-default-sink headphones_eq
# Pick the plain headphones again in pavucontrol for a flat sound (DJ cueing).
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Headphones EQ"
      media.name       = "Headphones EQ"
      filter.graph = {
        nodes = [
          { type = builtin name = preamp label = bq_highshelf control = { "Freq" = 0     "Q" = 1.00 "Gain" = -6.3 } }
          { type = builtin name = f1     label = bq_lowshelf  control = { "Freq" = 105   "Q" = 0.70 "Gain" = 6.5 } }
          { type = builtin name = f2     label = bq_peaking   control = { "Freq" = 221   "Q" = 0.46 "Gain" = -5.5 } }
          { type = builtin name = f3     label = bq_peaking   control = { "Freq" = 435   "Q" = 1.46 "Gain" = 9.1 } }
          { type = builtin name = f4     label = bq_peaking   control = { "Freq" = 1892  "Q" = 1.29 "Gain" = -3.5 } }
          { type = builtin name = f5     label = bq_peaking   control = { "Freq" = 6220  "Q" = 1.01 "Gain" = 3.9 } }
          { type = builtin name = f6     label = bq_highshelf control = { "Freq" = 10000 "Q" = 0.70 "Gain" = 2.4 } }
          { type = builtin name = f7     label = bq_peaking   control = { "Freq" = 7748  "Q" = 4.12 "Gain" = -1.3 } }
          { type = builtin name = f8     label = bq_peaking   control = { "Freq" = 72    "Q" = 2.37 "Gain" = -0.7 } }
          { type = builtin name = f9     label = bq_peaking   control = { "Freq" = 48    "Q" = 3.58 "Gain" = 1.0 } }
          { type = builtin name = f10    label = bq_peaking   control = { "Freq" = 2372  "Q" = 6.00 "Gain" = -1.0 } }
        ]
        links = [
          { output = "preamp:Out" input = "f1:In" }
          { output = "f1:Out" input = "f2:In" }
          { output = "f2:Out" input = "f3:In" }
          { output = "f3:Out" input = "f4:In" }
          { output = "f4:Out" input = "f5:In" }
          { output = "f5:Out" input = "f6:In" }
          { output = "f6:Out" input = "f7:In" }
          { output = "f7:Out" input = "f8:In" }
          { output = "f8:Out" input = "f9:In" }
          { output = "f9:Out" input = "f10:In" }
        ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props  = { node.name = "headphones_eq" media.class = Audio/Sink }
      # Always feed the headset itself. Without this the EQ follows the default
      # output, which is the EQ, and its sound ends up on another device.
      playback.props = {
        node.name     = "headphones_eq.out"
        node.passive  = true
        target.object = "alsa_output.usb-Corsair_CORSAIR_VIRTUOSO_XT_Wireless_Gaming_Receiver_1c55537f00030217-00.analog-stereo"
      }
    }
  }
]
