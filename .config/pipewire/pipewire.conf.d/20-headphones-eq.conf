# "Headphones EQ": an output that sits in front of the headphones and gives
# them a fuller sound. More low end (warmth, kick, bass lines), a touch more
# air on top. Everything is turned down 4.5 dB first so the boost never clips.
# Make it the default once: pactl set-default-sink headphones_eq
# Pick the plain headphones again in pavucontrol for a flat sound (DJ cueing).
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Headphones EQ"
      media.name       = "Headphones EQ"
      filter.graph = {
        nodes = [
          { type = builtin name = preamp label = bq_highshelf control = { "Freq" = 0     "Q" = 1.0 "Gain" = -4.5 } }
          { type = builtin name = bass   label = bq_lowshelf  control = { "Freq" = 105   "Q" = 0.7 "Gain" = 4.0 } }
          { type = builtin name = air    label = bq_highshelf control = { "Freq" = 10000 "Q" = 0.7 "Gain" = 1.5 } }
        ]
        links = [
          { output = "preamp:Out" input = "bass:In" }
          { output = "bass:Out"   input = "air:In" }
        ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props  = { node.name = "headphones_eq" media.class = Audio/Sink }
      playback.props = { node.name = "headphones_eq.out" node.passive = true }
    }
  }
]
