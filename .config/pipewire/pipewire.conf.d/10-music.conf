# Play music at the rate it was recorded at instead of resampling everything
# to 48 kHz. CDs and most downloads are 44.1 kHz, video is 48 kHz. PipeWire
# switches when the sound card is free; if another app is already playing,
# the new one gets resampled to match.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 ]
}
