# A PICO-8 cart: the __lua__ section is coloured and edited as Lua, the
# header and the sprite/map/sound sections are greyed out.
name = "PICO-8"
grammar = "p8"
path_suffixes = ["p8"]
line_comments = ["-- "]
block_comment = ["--[", "]"]
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
]
# Same indent rules as Lua, since the code is Lua.
increase_indent_pattern = "^\\s*(if|elseif|else|do|while|for|repeat|(local\\s+)?function|.+=\\s*function|.*[,(]\\s*function)\\b"
decrease_indent_pattern = "^\\s*(elseif|else|end|until)\\b"
